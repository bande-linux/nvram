name: ci

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Select crates
        run: |
          if pkg-config --exists dbus-1; then
            echo "EXCLUDE=" >> "$GITHUB_ENV"
          else
            echo "libdbus-1 is missing, skipping bande-btsync"
            echo "EXCLUDE=--exclude bande-btsync" >> "$GITHUB_ENV"
          fi

      - name: check
        run: cargo check --locked --workspace $EXCLUDE --all-targets

      - name: clippy
        run: cargo clippy --locked --workspace $EXCLUDE --all-targets -- -D warnings

      - name: test
        run: cargo test --locked --workspace $EXCLUDE

  fmt:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: fmt
        run: cargo fmt --all --check

  deb:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Build the packages on Debian testing
        run: |
          mkdir -p out
          git archive --prefix=src/ HEAD | docker run --rm -i debian:testing sh -euc '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends build-essential debhelper cargo rustc ca-certificates lintian >/dev/null
            tar -x -C /tmp
            cd /tmp/src
            dpkg-buildpackage -us -uc -b >&2
            lintian --fail-on error --suppress-tags no-copyright-file ../*.deb >&2
            dpkg -i ../*.deb >&2
            bande-nvram --help >&2
            bande-bless --help >&2
            cd /tmp && tar -c *.deb' | tar -x -C out
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: nvram-debs
          path: out/*.deb
