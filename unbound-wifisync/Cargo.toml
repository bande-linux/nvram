[package]
name = "unbound-wifisync"
license = "MIT"
version = "0.2.4"
edition = "2021"

description = "A tool to sync Wifi passwords with macos on ARM Macs"
homepage = "https://github.com/unbound-linux/nvram"
repository = "https://github.com/unbound-linux/nvram"

[dependencies]
rust-ini = "0.21"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies.apple-nvram]
path = "../apple-nvram"
version = "0.3"

[dependencies.clap]
version = "4.5"
features = ["cargo"]

